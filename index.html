<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repaso Laboratorio - Anime.js Coreografía</title>
    <link rel="stylesheet" href="style.css">
    <!-- Incluir Anime.js desde CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
</head>
<body>

    <main class="scene">
        <div class="shield-container">
            <!-- SVG del Escudo del Colegio recreado para animación -->
            <svg id="school-shield" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470">
                <defs>
                    <!-- Ruta curva para el texto de Copérnico -->
                    <path id="copernico-path" d="M 60,370 C 100,420 300,420 340,370" fill="none"/>
                </defs>
                
                <!-- Cuerpo del Escudo -->
                <path class="shield-border" d="M 200,10 C 230,20 260,20 290,10 L 320,30 C 350,50 370,80 370,120 L 370,220 C 370,260 350,300 310,340 L 200,450 L 90,340 C 50,300 30,260 30,220 L 30,120 C 30,80 50,50 80,30 Z" fill="none" stroke="black" stroke-width="4"/>
                <path class="shield-body" d="M 200,10 C 230,20 260,20 290,10 L 320,30 C 350,50 370,80 370,120 L 370,220 C 370,260 350,300 310,340 L 200,450 L 90,340 C 50,300 30,260 30,220 L 30,120 C 30,80 50,50 80,30 Z" fill="#ffeb3b" opacity="0"/>

                <!-- Engranajes y Texto central -->
                <g class="central-elements" opacity="0">
                    <!-- Engranaje Grande y Texto IPET superpuesto -->
                    <g class="gear-large-group" transform="translate(230, 230)">
                        <path class="gear-large" d="M -70,0 A 70,70 0 1,0 70,0 A 70,70 0 1,0 -70,0 M -75,-2 L -75,2 L -71,2 L -71,-2 Z M -65,-36 L -65,-32 L -61,-32 L -61,-36 Z M -36,-65 L -36,-61 L -32,-61 L -32,-65 Z M -2,-75 L 2,-75 L 2,-71 L -2,-71 Z M 32,-65 L 32,-61 L 36,-61 L 36,-65 Z M 61,-36 L 61,-32 L 65,-32 L 65,-36 Z M 71,-2 L 71,2 L 75,2 L 75,-2 Z M 65,32 L 65,36 L 61,36 L 61,32 Z M 36,61 L 36,65 L 32,65 L 32,61 Z M 2,71 L -2,71 L -2,75 L 2,75 Z M -32,65 L -32,61 L -36,61 L -36,65 Z M -61,36 L -61,32 L -65,32 L -65,36 Z M 0,0 L 0,-10 L 5,-15 L 5,-5 L 10,0 L 5,5 L 5,15 L 0,10 L -5,15 L -5,5 L -10,0 L -5,-5 Z" fill="#f44336" stroke="#d32f2f" stroke-width="2"/>
                        
                        <text class="ipet-text" font-family="Verdana" font-size="40" fill="black" text-anchor="middle">
                            <tspan class="char char-I" x="-45" y="-10" transform="rotate(-15 -45 -10)">I</tspan>
                            <tspan class="char char-P" x="-10" y="-10" transform="rotate(5 -10 -10)">P</tspan>
                            <tspan class="char char-E" x="25" y="-10" transform="rotate(20 25 -10)">E</tspan>
                            <tspan class="char char-T" x="65" y="-10" transform="rotate(40 65 -10)">T</tspan>
                        </text>
                    </g>
                    
                    <!-- Engranaje Pequeño -->
                    <g class="gear-small-group" transform="translate(130, 130)">
                        <path class="gear-small" d="M -45,0 A 45,45 0 1,0 45,0 A 45,45 0 1,0 -45,0 M -49,-1 L -49,1 L -46,1 L -46,-1 Z M -39,-25 L -39,-23 L -36,-23 L -36,-25 Z M -25,-39 L -25,-36 L -23,-36 L -23,-39 Z M -1,-49 L 1,-49 L 1,-46 L -1,-46 Z M 23,-39 L 23,-36 L 25,-36 L 25,-39 Z M 36,-25 L 36,-23 L 39,-23 L 39,-25 Z M 46,-1 L 46,1 L 49,1 L 49,-1 Z M 39,23 L 39,25 L 36,25 L 36,23 Z M 25,36 L 25,39 L 23,39 L 23,36 Z M 1,46 L -1,46 L -1,49 L 1,49 Z M -23,36 L -23,39 L -25,39 L -25,36 Z M -36,23 L -36,25 L -39,25 L -39,23 Z" fill="#f44336" stroke="#d32f2f" stroke-width="1.5"/>
                    </g>
                </g>

                <!-- Número "249" -->
                <text class="num-249" x="200" y="320" font-family="Verdana" font-size="60" font-weight="bold" fill="black" text-anchor="middle" opacity="0">249</text>

                <!-- Texto curvo inferior -->
                <text class="copernico-text" font-family="Verdana" font-size="28" fill="black" text-anchor="middle" opacity="0">
                    <textPath xlink:href="#copernico-path" startOffset="50%">Nicolás Copérnico</textPath>
                </text>
            </svg>
        </div>

        <!-- Panel de información técnica -->
        <aside class="info-panel">
            <h2>Potencialidad de Anime.js</h2>
            <ul>
                <li class="info-item item-timeline"><span>Timelines:</span> Coreografías visuales complejas paso a paso.</li>
                <li class="info-item item-stagger"><span>Staggering:</span> Retrasos escalonados para elementos múltiples.</li>
                <li class="info-item item-svg"><span>SVG Path Morphing:</span> Transformación de formas complejas.</li>
            </ul>
        </aside>
    </main>

    <!-- Vincular la lógica de animación -->
    <script src="script.js"></script>
</body>
</html>
